name: Hospital Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend Build and Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml

      - name: Build backend
        run: mvn -B -f app/backend/pom.xml clean package -DskipTests

      - name: Scan backend dependencies
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: Hospital-Management-Backend
          path: app/backend
          format: HTML
          out: reports
          args: >
            --enableRetired
        continue-on-error: true

      - name: Upload backend dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-report
          path: reports/
          if-no-files-found: ignore

  frontend-build:
    name: Frontend Build and Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: app/frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
