
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hospital-management
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Puneeth2204/production-devsecops-platform.git
    targetRevision: main
    path: helm/hospital-management
    helm:
      releaseName: hospital-management
  destination:
    server: https://kubernetes.default.svc
    namespace: hospital-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
