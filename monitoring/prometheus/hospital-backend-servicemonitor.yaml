apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hospital-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - hospital-management
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
